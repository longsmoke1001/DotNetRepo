<!DOCTYPE html>
<html>

<head>
    <title>My Notes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fdd1d1;
        }

        h1 {
            color: #333;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: white;
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .note-category {
            font-size: 12px;
            color: #888;
            margin-left: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📝 我的備忘錄</h1>
        <button onclick="fetchNotes()">Load Notes</button>
    </div>
    <ul id="notesList"></ul>
    <div class="note">
        <h3>測試備忘錄 1</h3>
        <p>呢個係第 1 個測試備忘錄嘅內容。</p>
        <span class="category">dairy</span>
    </div>

    <script>
        async function fetchNotes() {
            try {
                // ✅ 加入 pageNumber 同 pageSize
                const response = await fetch('http://localhost:5027/api/notes?pageNumber=1&pageSize=10');
                const data = await response.json();

                // 由 data.result.items 拎 Notes Array
                const notes = data.result?.items || [];

                const list = document.getElementById('notesList');
                if (notes.length === 0) {
                    list.innerHTML = '<li>📭 暫時冇備忘錄</li>';
                } else {
                    list.innerHTML = notes.map(n => `
                <li>
                    <strong>${n.title}</strong>
                    <span class="note-category">${n.category}</span>
                </li>
            `).join('');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('無法載入備忘錄，請確保你個 API 已經 run 緊。');
            }
        }
    </script>

</body>

</html>
